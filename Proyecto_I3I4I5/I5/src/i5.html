<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I5 - SELECT THE COLOR</title>
    <link rel="icon" type="image/png" href="../../menu/img/logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="ribbon-wrap">
            <h1 class="ribbon">LEVEL I5</h1>
        </div>
        <hr class="line">

        <div class="actions">
            <button class="btn btn-help" id="help" aria-label="How to play">?</button>

            <button class="btn btn-sound" id="sound" aria-label="Sound">
                <img id="sound-img" src="../img/sound_on.svg" alt="">
            </button>
            <a class="btn btn-back" href="../../menu/src/index.html">BACK ←</a>
        </div>
    </header>

    <main class="game">
        <p class="word" id="word">RED</p>

        <div class="colors">
            <button class="color" data-color="RED"    style="--c: #e53935" aria-label="Red"></button>
            <button class="color" data-color="ORANGE" style="--c: #fb8c00" aria-label="Orange"></button>
            <button class="color" data-color="YELLOW" style="--c: #fdd835" aria-label="Yellow"></button>
            <button class="color" data-color="GREEN"  style="--c: #43a047" aria-label="Green"></button>
            <button class="color" data-color="BLUE"   style="--c: #1e88e5" aria-label="Blue"></button>
            <button class="color" data-color="PURPLE" style="--c: #8e24aa" aria-label="Purple"></button>
        </div>

        <div class="progress" id="progress">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </main>

    <!-- TUTORIAL -->
    <dialog class="tutorial" id="tutorial" aria-labelledby="tutorial-title">
        <div class="ribbon-wrap">
            <h2 class="ribbon ribbon-small" id="tutorial-title">HOW TO PLAY</h2>
        </div>

        <ol class="steps">
            <li class="step">
                <img src="../img/tutorial/step1.svg" alt="">
                <p>LOOK at the word.</p>
            </li>
            <li class="step">
                <img src="../img/tutorial/step2.svg" alt="">
                <p>PRESS to LISTEN.</p>
            </li>
            <li class="step">
                <img src="../img/tutorial/step3.svg" alt="">
                <p>TAP the color.</p>
            </li>
            <li class="step">
                <img src="../img/tutorial/step4.svg" alt="">
                <p>YES? Good! NO? Try again!</p>
            </li>
            <li class="step">
                <img src="../img/tutorial/step5.svg" alt="">
                <p>6 dots = YOU WIN!</p>
            </li>
        </ol>

        <button class="btn btn-ok" id="tutorial-close">OK, LET'S PLAY!</button>
    </dialog>

    <script src="i5.js"></script>
</body>
</html>
